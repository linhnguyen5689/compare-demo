<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compare Demo</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin-bottom: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      position: sticky;
      top: 0;
      background: #1e1e1e;
      padding: 12px;
      font-size: 18px;
      border: 1px solid #333;
      z-index: 10;
    }

    td {
      border: 1px solid #333;
      padding: 12px;
      text-align: center;
      vertical-align: top;
      background: #181818;
    }

    img {
      width: 220px;
      border-radius: 10px;
      transition: 0.2s ease;
      cursor: pointer;
    }

    img:hover {
      transform: scale(1.03);
    }

    .case-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: left;
    }

    .row-separator td {
      padding-top: 24px;
      background: transparent;
      border: none;
    }
  </style>
</head>

<body>

<h1>Watermark / Sticker / Doodle Remove Compare</h1>

<table>
